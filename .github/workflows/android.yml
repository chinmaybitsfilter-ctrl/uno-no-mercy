name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Wrap the game in an Android app (Capacitor)
        run: |
          mkdir app && cd app
          npm init -y >/dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cp -r ../docs www
          rm -f www/sw.js
          npx cap init "UNO No Mercy" com.chinmay.unonomercy --web-dir=www
          npx cap add android
          # app icon
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              [ -f android/app/src/main/res/mipmap-$d/$f.png ] && cp ../docs/icons/icon-512.png android/app/src/main/res/mipmap-$d/$f.png || true
            done
          done
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/UNO-No-Mercy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UNO-No-Mercy-apk
          path: UNO-No-Mercy.apk

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: UNO No Mercy v1.${{ github.run_number }}
          body: |
            📱 **Android:** download `UNO-No-Mercy.apk` below and open it (allow "Install unknown apps" when asked).
            💻 **Laptop / iPhone:** play at https://chinmaybitsfilter-ctrl.github.io/uno-no-mercy/ and use *Install app*.
          files: UNO-No-Mercy.apk
          make_latest: true
